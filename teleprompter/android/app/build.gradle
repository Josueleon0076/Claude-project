plugins {
    id 'com.android.application'
}

android {
    namespace 'com.josue.teleprompter'
    compileSdk 34

    defaultConfig {
        applicationId 'com.josue.teleprompter'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // La interfaz es la misma página web que usa la iPad: teleprompter/web/
    sourceSets {
        main {
            assets.srcDirs = ['../../web']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
